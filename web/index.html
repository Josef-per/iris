<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iris">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iris</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Some remote browser previews expose POSIX locale names such as
    // "en-US@posix", which are not valid BCP 47 language tags. Flutter reads
    // these values before main() and otherwise fails with a blank screen.
    (() => {
      const fallbackLocale = 'pt-BR';
      const normalizeLocale = (locale) => {
        if (typeof locale !== 'string' || locale.length === 0) {
          return fallbackLocale;
        }

        const normalized = locale
          .split('.')[0]
          .split('@')[0]
          .replaceAll('_', '-');

        try {
          return Intl.getCanonicalLocales(normalized)[0] || fallbackLocale;
        } catch (_) {
          return fallbackLocale;
        }
      };

      const language = normalizeLocale(navigator.language);
      const languages = (navigator.languages || [language]).map(normalizeLocale);

      Object.defineProperty(navigator, 'language', {
        configurable: true,
        get: () => language,
      });
      Object.defineProperty(navigator, 'languages', {
        configurable: true,
        get: () => languages,
      });
    })();
  </script>
  <!--

    or to give the user feedback during the initialization process.

    For more details:

  <!-- Required by the passkeys_web plugin pulled in by supabase_flutter. -->
  <script src="passkeys_bundle.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
